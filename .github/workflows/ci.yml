name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test the floor, not just today.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python tests/test_invariant.py

  dogfood:
    # invariant.yaml at the repo root has to actually pass on every commit --
    # a tool built to verify claims can't carry an unverified claim about its
    # own repo. Uses carabiner, not firedrill: no Postgres dump to restore here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e . carabiner-sec
      - run: invariant run invariant.yaml

  postgres_restore:
    # The one check type untested by `dogfood` or `package`: it needs a real
    # dump and firedrill's own container restore, which is slow and
    # Docker-only, so it gets its own job instead of slowing down `test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e . firedrill
      - run: python examples/make_demo_dump.py
      - name: postgres_restore passes against a real dump
        run: |
          cat > /tmp/restore.yaml <<'EOF'
          invariants:
            - name: demo_dump_restores
              check: postgres_restore
              args: {dump: examples/demo.dump}
          EOF
          invariant run /tmp/restore.yaml

  package:
    # Build and install the distribution on every commit, not only at release --
    # a packaging break (missing package data, wrong entry point) is invisible
    # to `pip install -e .` and only shows up in the wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel and run it as a user would
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --disable-pip-version-check -q dist/*.whl
          /tmp/v/bin/invariant --help > /dev/null
          test "$(/tmp/v/bin/python -c 'import invariant; print(invariant.__version__)')" \
             = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
