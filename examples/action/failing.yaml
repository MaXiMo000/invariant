# Used by CI to prove action.yml fails the build: one check fails, one can't run.
invariants:
  - name: readme_exists
    check: filesystem
    args: {path: README.md}
  - name: a_file_that_is_not_there
    check: filesystem
    args: {path: no-such-file.txt}
  - name: an_unreachable_endpoint
    check: http
    args: {url: "http://127.0.0.1:9/", expect_status: 200}
