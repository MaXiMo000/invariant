# Runnable as-is: `invariant run examples/invariant.yaml`
# (build the demo db first: `python examples/make_demo_db.py`)
invariants:
  - name: no_negative_payments
    check: sql
    args:
      dsn: examples/demo.db
      query: "SELECT COUNT(*) FROM payments WHERE amount < 0"
      must_equal: 0

  - name: orphan_orders_are_zero
    check: sql
    args:
      dsn: examples/demo.db
      query: "SELECT COUNT(*) FROM orders WHERE customer_id NOT IN (SELECT id FROM customers)"
      must_equal: 0

  # Customer 999 never existed in this demo db (see orphan_orders_are_zero,
  # above) -- one pass/fail across both tables instead of two separate sql
  # checks a human has to mentally combine to know an erasure is complete.
  - name: customer_999_fully_erased
    check: gdpr_erasure
    args:
      dsn: examples/demo.db
      subject_id: 999
      stores:
        - table: customers
          column: id
        - table: orders
          column: customer_id

  # migration_diff compares two LIVE queries to each other, not a query to
  # a number written down once -- source and destination can be different
  # dsns entirely (a real migration), but don't have to be: this demo
  # checks two different tables in the same db, e.g. "did every order get
  # a payment" during a denormalization step.
  - name: order_and_payment_counts_agree
    check: migration_diff
    args:
      source:
        dsn: examples/demo.db
        query: "SELECT COUNT(*) FROM orders"
      destination:
        dsn: examples/demo.db
        query: "SELECT COUNT(*) FROM payments"

